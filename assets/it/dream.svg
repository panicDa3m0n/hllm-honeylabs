<svg xmlns="http://www.w3.org/2000/svg" xml:lang="it" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-label="Modalità sogno: di notte HLLM finisce i tuoi progetti e prepara sorprese per il mattino">
<style>
text{font-family:"Segoe UI","Helvetica Neue",Arial,sans-serif}
.star{animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.2}50%{opacity:1}}
.s2{animation-delay:1s}.s3{animation-delay:2s}
.job{animation:job 9s ease-in-out infinite;transform-box:fill-box;transform-origin:left}
@keyframes job{0%{transform:scaleX(0)}70%,100%{transform:scaleX(1)}}
.j2{animation-delay:.8s}.j3{animation-delay:1.6s}.j4{animation-delay:2.4s}
.done{opacity:0;animation:done 9s infinite}
@keyframes done{0%,72%{opacity:0;transform:translateY(12px)}78%,96%{opacity:1;transform:translateY(0)}100%{opacity:0}}
</style>
<rect width="1200" height="560" rx="28" fill="#15141A"/>
<circle class="star" cx="820" cy="80" r="2.5" fill="#fff4d6"/><circle class="star s2" cx="980" cy="120" r="2" fill="#fff4d6"/><circle class="star s3" cx="1100" cy="70" r="2.5" fill="#fff4d6"/><circle class="star" cx="720" cy="150" r="1.8" fill="#fff4d6"/>
<path d="M1060 140 a46 46 0 1 1 -40 -70 a36 36 0 1 0 40 70z" fill="#ffb020" opacity=".9"/>
<text x="64" y="76" font-size="18" font-weight="700" fill="#ffb020" letter-spacing="5">MODALITÀ SOGNO</text>
<text x="64" y="122" font-size="38" font-weight="800" fill="#fff4d6">Tu dormi. <tspan fill="#ffb020">Lei crea.</tspan></text>
<g transform="translate(64 170)">
<rect width="640" height="330" rx="24" fill="#27252d"/>
<text x="32" y="48" font-size="15" font-weight="700" fill="#d9cfb8" letter-spacing="3">STANOTTE · 02:14</text>
<text x="32" y="98" font-size="18" fill="#fff4d6">App per le piante, v2</text><rect x="330" y="84" width="270" height="12" rx="6" fill="#3a3742"/><rect class="job" x="330" y="84" width="270" height="12" rx="6" fill="#ffb020"/>
<text x="32" y="158" font-size="18" fill="#fff4d6">La tua settimana, film da 60 s</text><rect x="330" y="144" width="270" height="12" rx="6" fill="#3a3742"/><rect class="job j2" x="330" y="144" width="270" height="12" rx="6" fill="#ffb020"/>
<text x="32" y="218" font-size="18" fill="#fff4d6">Una canzone dalle note di oggi</text><rect x="330" y="204" width="270" height="12" rx="6" fill="#3a3742"/><rect class="job j3" x="330" y="204" width="270" height="12" rx="6" fill="#ffb020"/>
<text x="32" y="278" font-size="18" fill="#fff4d6">212 ricordi → 9 note</text><rect x="330" y="264" width="270" height="12" rx="6" fill="#3a3742"/><rect class="job j4" x="330" y="264" width="270" height="12" rx="6" fill="#ffb020"/>
</g>
<g transform="translate(760 200)">
<rect width="376" height="300" rx="36" fill="#0e0d12" stroke="#3a3742" stroke-width="3"/>
<text x="188" y="56" font-size="34" font-weight="300" fill="#d9cfb8" text-anchor="middle">7:02</text>
<g class="done"><rect x="22" y="86" width="332" height="186" rx="22" fill="#27252d" stroke="#ffb020" stroke-width="2"/>
<text x="44" y="120" font-size="13" font-weight="700" fill="#ffb020" letter-spacing="2">HLLM · BUONGIORNO</text>
<text x="44" y="152" font-size="17" fill="#fff4d6">Mentre dormivi ho finito</text>
<text x="44" y="176" font-size="17" fill="#fff4d6">la tua app e 3 sorprese.</text>
<rect x="44" y="204" width="132" height="44" rx="22" fill="#ffb020"/><text x="110" y="232" font-size="15" font-weight="700" fill="#1a1205" text-anchor="middle">Fammi vedere</text>
<rect x="190" y="204" width="132" height="44" rx="22" fill="none" stroke="#d9cfb8"/><text x="256" y="232" font-size="15" fill="#d9cfb8" text-anchor="middle">Dopo</text></g>
</g>
</svg>
