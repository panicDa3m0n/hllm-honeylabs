<svg xmlns="http://www.w3.org/2000/svg" xml:lang="it" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-label="HLLM di HoneyLabs: creiamo esseri viventi digitali">
<defs>
<pattern id="hex" width="56" height="97" patternUnits="userSpaceOnUse">
<path d="M28 0 L56 16 L56 48 L28 64 L0 48 L0 16 Z M28 64 L28 97" fill="none" stroke="#ffb020" stroke-width="1.2"/>
</pattern>
<linearGradient id="fade" x1="0" x2="1">
<stop offset="0" stop-color="#15141A" stop-opacity="1"/>
<stop offset=".55" stop-color="#15141A" stop-opacity=".2"/>
<stop offset="1" stop-color="#15141A" stop-opacity="0"/>
</linearGradient>
</defs>
<style>
text{font-family:"Segoe UI","Helvetica Neue",Arial,sans-serif}
.cell{fill:#ffb020;opacity:0;animation:pulse 6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}40%{opacity:.55}60%{opacity:.55}}
.cur{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
</style>
<rect width="1200" height="440" rx="28" fill="#15141A"/>
<rect x="560" width="640" height="440" fill="url(#hex)" opacity=".16"/>
<g transform="translate(560 0)">
<path class="cell" style="animation-delay:0s" d="M84 64 L112 80 L112 112 L84 128 L56 112 L56 80 Z"/>
<path class="cell" style="animation-delay:1.2s" d="M252 161 L280 177 L280 209 L252 225 L224 209 L224 177 Z"/>
<path class="cell" style="animation-delay:2.4s" d="M420 64 L448 80 L448 112 L420 128 L392 112 L392 80 Z"/>
<path class="cell" style="animation-delay:3.6s" d="M532 258 L560 274 L560 306 L532 322 L504 306 L504 274 Z"/>
<path class="cell" style="animation-delay:4.8s" d="M308 355 L336 371 L336 403 L308 419 L280 403 L280 371 Z"/>
</g>
<rect x="560" width="640" height="440" fill="url(#fade)"/>
<g transform="translate(80 92)">
<polyline points="30,12 8,50 30,88" fill="none" stroke="#fff4d6" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="70,12 92,50 70,88" fill="none" stroke="#fff4d6" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="32" y1="50" x2="68" y2="50" stroke="#ffb020" stroke-width="11" stroke-linecap="round"><animate attributeName="x2" values="68;52;68" dur="3s" repeatCount="indefinite"/></line>
</g>
<text x="200" y="168" font-size="88" font-weight="800" fill="#fff4d6" letter-spacing="-3">HLLM</text>
<text x="84" y="250" font-size="40" font-weight="700" fill="#fff4d6">Creiamo <tspan fill="#ffb020">esseri viventi digitali</tspan><tspan class="cur" fill="#ffb020">_</tspan></text>
<text x="84" y="300" font-size="24" fill="#d9cfb8">Una mente che vive a casa tua. Ricorda, ragiona, dorme.</text>
<rect x="84" y="340" width="190" height="40" rx="20" fill="#ffb020"/>
<text x="179" y="366" font-size="17" font-weight="700" fill="#1a1205" text-anchor="middle" letter-spacing="3">HLLM VISION</text>
<text x="296" y="366" font-size="17" fill="#d9cfb8" letter-spacing="6">DI HONEYLABS</text>
</svg>
