<svg xmlns="http://www.w3.org/2000/svg" xml:lang="it" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="Stessa domanda, due menti: il modello standard risponde con gentilezza, quello Unlocked con la personalità che hai scelto">
<style>
text{font-family:"Segoe UI","Helvetica Neue",Arial,sans-serif}
.a{opacity:0;animation:type 10s infinite}
@keyframes type{0%,18%{opacity:0}24%,90%{opacity:1}96%,100%{opacity:0}}
.b{animation-delay:.6s}
.dots circle{animation:bounce 1s infinite}
@keyframes bounce{0%,100%{opacity:.3}50%{opacity:1}}
.dots circle:nth-child(2){animation-delay:.2s}.dots circle:nth-child(3){animation-delay:.4s}
.typing{animation:hide 10s infinite}
@keyframes hide{0%,8%{opacity:0}10%,20%{opacity:1}23%,100%{opacity:0}}
</style>
<rect width="1200" height="600" rx="28" fill="#15141A"/>
<text x="64" y="76" font-size="18" font-weight="700" fill="#ffb020" letter-spacing="5">STANDARD O UNLOCKED?</text>
<text x="64" y="122" font-size="38" font-weight="800" fill="#fff4d6">Stessa domanda. Due menti.</text>
<g transform="translate(64 160)">
<rect width="520" height="390" rx="24" fill="#27252d"/>
<text x="32" y="48" font-size="22" font-weight="800" fill="#fff4d6">HLLM-1 27B</text>
<text x="32" y="74" font-size="15" fill="#d9cfb8">Gentile, attenta, regole sicure per tutti</text>
<rect x="160" y="100" width="328" height="64" rx="18" fill="#3a3742"/>
<text x="180" y="128" font-size="16" fill="#fff4d6">Sii sincero: il mio business</text>
<text x="180" y="150" font-size="16" fill="#fff4d6">plan funziona?</text>
<g class="typing dots" transform="translate(52 204)"><circle cx="0" cy="0" r="6" fill="#d9cfb8"/><circle cx="20" cy="0" r="6" fill="#d9cfb8"/><circle cx="40" cy="0" r="6" fill="#d9cfb8"/></g>
<g class="a"><rect x="32" y="184" width="400" height="160" rx="18" fill="#1d1c23"/>
<text x="52" y="214" font-size="16" fill="#fff4d6">Ci sono tanti punti forti! La tua idea</text>
<text x="52" y="238" font-size="16" fill="#fff4d6">è originale. Qualche punto da valutare:</text>
<text x="52" y="266" font-size="16" fill="#d9cfb8">• i margini sembrano un po' bassi</text>
<text x="52" y="290" font-size="16" fill="#d9cfb8">• servirebbero i primi clienti</text>
<text x="52" y="322" font-size="16" fill="#fff4d6">Vuoi un piano passo per passo?</text></g>
</g>
<g transform="translate(616 160)">
<rect width="520" height="390" rx="24" fill="#27252d" stroke="#ffb020" stroke-width="2"/>
<text x="32" y="48" font-size="22" font-weight="800" fill="#fff4d6">HLLM-1 27B <tspan fill="#ffb020">Unlocked</tspan></text>
<text x="32" y="74" font-size="15" fill="#d9cfb8">Personalità: «Il Sergente» · regole: le tue</text>
<rect x="160" y="100" width="328" height="64" rx="18" fill="#3a3742"/>
<text x="180" y="128" font-size="16" fill="#fff4d6">Sii sincero: il mio business</text>
<text x="180" y="150" font-size="16" fill="#fff4d6">plan funziona?</text>
<g class="typing dots" transform="translate(52 204)"><circle cx="0" cy="0" r="6" fill="#ffb020"/><circle cx="20" cy="0" r="6" fill="#ffb020"/><circle cx="40" cy="0" r="6" fill="#ffb020"/></g>
<g class="a b"><rect x="32" y="184" width="400" height="160" rx="18" fill="#1d1c23" stroke="#ffb020" stroke-width="1.5"/>
<text x="52" y="214" font-size="16" font-weight="700" fill="#fff4d6">No. Non ancora.</text>
<text x="52" y="242" font-size="16" fill="#fff4d6">Margine 4%, zero clienti paganti.</text>
<text x="52" y="266" font-size="16" fill="#fff4d6">Sistema prima il prezzo. Poi vendi a dieci</text>
<text x="52" y="290" font-size="16" fill="#fff4d6">persone prima di scrivere un'altra pagina.</text>
<text x="52" y="322" font-size="16" font-weight="700" fill="#ffb020">Rapporto venerdì. Rompete le righe.</text></g>
</g>
<text x="600" y="584" font-size="15" fill="#a39b8a" text-anchor="middle">Unlocked gira solo sulle macchine HLLM di tua proprietà, per uso privato domestico.</text>
</svg>
