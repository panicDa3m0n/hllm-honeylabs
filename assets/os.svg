<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="HLLM OS connects your home, the web and your phone around one mind">
<style>
text{font-family:"Segoe UI","Helvetica Neue",Arial,sans-serif}
.flow{stroke-dasharray:6 10;animation:flow 1.6s linear infinite}
@keyframes flow{to{stroke-dashoffset:-32}}
.core{animation:breathe 4s ease-in-out infinite;transform-origin:600px 330px}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.ring{animation:ring 4s ease-out infinite;transform-origin:600px 330px}
@keyframes ring{0%{transform:scale(.8);opacity:.6}100%{transform:scale(1.8);opacity:0}}
</style>
<rect width="1200" height="600" rx="28" fill="#15141A"/>
<text x="64" y="76" font-size="18" font-weight="700" fill="#ffb020" letter-spacing="5">HLLM OS</text>
<text x="64" y="122" font-size="38" font-weight="800" fill="#fff4d6">Not just a model. <tspan fill="#ffb020">A home for it.</tspan></text>
<g stroke="#ffb020" stroke-width="2.5" fill="none">
<path class="flow" d="M600 330 L250 220"/><path class="flow" d="M600 330 L250 450"/>
<path class="flow" d="M600 330 L950 220"/><path class="flow" d="M600 330 L950 450"/>
<path class="flow" d="M600 330 L600 530"/>
</g>
<path class="ring" d="M600 270 L652 300 L652 360 L600 390 L548 360 L548 300 Z" fill="none" stroke="#ffb020" stroke-width="2"/>
<g class="core">
<path d="M600 270 L652 300 L652 360 L600 390 L548 360 L548 300 Z" fill="#27252d" stroke="#ffb020" stroke-width="3"/>
<g transform="translate(575 305) scale(.5)"><polyline points="30,12 8,50 30,88" fill="none" stroke="#fff4d6" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><polyline points="70,12 92,50 70,88" fill="none" stroke="#fff4d6" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><line x1="32" y1="50" x2="68" y2="50" stroke="#ffb020" stroke-width="12" stroke-linecap="round"/></g></g>
<g transform="translate(100 180)"><rect width="230" height="84" rx="20" fill="#27252d"/><circle cx="44" cy="42" r="16" fill="none" stroke="#ffb020" stroke-width="3"/><path d="M38 60 h12" stroke="#ffb020" stroke-width="3"/><text x="76" y="38" font-size="18" font-weight="700" fill="#fff4d6">Smart home</text><text x="76" y="62" font-size="14" fill="#d9cfb8">lights, heating, cameras</text></g>
<g transform="translate(100 410)"><rect width="230" height="84" rx="20" fill="#27252d"/><circle cx="44" cy="42" r="17" fill="none" stroke="#ffb020" stroke-width="3"/><path d="M27 42 h34 M44 25 c-10 10 -10 24 0 34 c10 -10 10 -24 0 -34" fill="none" stroke="#ffb020" stroke-width="2"/><text x="76" y="38" font-size="18" font-weight="700" fill="#fff4d6">Web research</text><text x="76" y="62" font-size="14" fill="#d9cfb8">reads, checks, cites</text></g>
<g transform="translate(870 180)"><rect width="230" height="84" rx="20" fill="#27252d"/><rect x="30" y="22" width="26" height="42" rx="6" fill="none" stroke="#ffb020" stroke-width="3"/><text x="76" y="38" font-size="18" font-weight="700" fill="#fff4d6">Your phone</text><text x="76" y="62" font-size="14" fill="#d9cfb8">screens that appear, then vanish</text></g>
<g transform="translate(870 410)"><rect width="230" height="84" rx="20" fill="#27252d"/><path d="M30 30 h28 v24 h-28z M36 30 v-6 h16 v6" fill="none" stroke="#ffb020" stroke-width="3"/><text x="76" y="38" font-size="18" font-weight="700" fill="#fff4d6">Agents at work</text><text x="76" y="62" font-size="14" fill="#d9cfb8">tasks done while you're away</text></g>
<g transform="translate(485 500)"><rect width="230" height="70" rx="20" fill="#27252d"/><path d="M30 24 h28 v22 h-28z M34 50 h20" fill="none" stroke="#ffb020" stroke-width="3"/><text x="70" y="44" font-size="18" font-weight="700" fill="#fff4d6">Your files &amp; apps</text></g>
</svg>
